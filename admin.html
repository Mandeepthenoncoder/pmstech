<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Applications | Purple Magic</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --bg:#000; --s1:#181818; --s2:#1F1F1F; --s3:#272727; --line:#313131;
  --text:#FFF; --muted:#9B9B9B; --accent:#7C3AED; --accent-t:#B794F6;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --sans:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-t);outline-offset:2px;border-radius:4px}
a{color:var(--accent-t)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9999px;border:1px solid transparent;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 700ms var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.p{background:var(--accent);color:#fff}
.p:hover{background:var(--accent-t);color:#000}
.g{background:transparent;border-color:var(--line)}
.g:hover{background:var(--s3)}
.danger{background:transparent;border-color:rgba(248,113,113,.4);color:var(--bad)}
.danger:hover{background:rgba(248,113,113,.12)}
.sm{padding:6px 12px;font-size:13px;line-height:18px}

/* ---------------------------------------------------------------- login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;display:grid;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:32px}
.login h1{font-size:24px;line-height:32px}
.login label{display:block;font-size:14px;line-height:20px;font-weight:500;margin-bottom:8px}
.login input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.login input:focus-visible{border-color:var(--accent);outline:none}
.err{font-size:14px;line-height:20px;color:var(--bad);min-height:20px}

/* ---------------------------------------------------------------- shell */
header.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.brand svg{width:24px;height:24px}
.grow{flex:1}
select,.search{padding:8px 12px;border-radius:9999px;border:1px solid var(--line);background:var(--bg);font-size:14px;line-height:20px}
.search{min-width:170px}
.count{font-size:13px;color:var(--muted)}

.buckets{position:sticky;top:57px;z-index:19;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.bucket{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9999px;border:1px solid var(--line);background:var(--s1);font-size:14px;line-height:20px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 700ms var(--ease)}
.bucket:hover{color:var(--text);border-color:var(--muted)}
.bucket.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bucket b{font-family:var(--mono);font-weight:500;font-size:13px;padding:1px 7px;border-radius:9999px;background:rgba(255,255,255,.12)}
.bucket.on b{background:rgba(0,0,0,.25)}

.list{padding:16px;display:grid;gap:8px;align-content:start;max-width:1100px;margin:0 auto}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;transition:all 700ms var(--ease)}
.row:hover{border-color:var(--accent);transform:translateY(-1px)}
.score{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:500 17px/1 var(--mono);background:var(--s3)}
.score.hi{background:rgba(74,222,128,.15);color:var(--ok)}
.score.mid{background:rgba(251,191,36,.15);color:var(--warn)}
.score.lo{background:rgba(248,113,113,.12);color:var(--bad)}
.who{display:grid;gap:3px;min-width:0}
.who b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{font-size:11px;line-height:16px;padding:3px 9px;border-radius:9999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ko{border-color:var(--bad);color:var(--bad)}
.pill.flag{border-color:var(--warn);color:var(--warn)}
.pill.st{border-color:var(--accent);color:var(--accent-t)}
.empty{padding:64px 24px;text-align:center;color:var(--muted)}

/* -------------------------------------------------------------- profile */
.profile{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.pro-scroll{overflow:visible}
.pro-top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--line)}
.pro-body{padding:24px 16px 40px;max-width:860px;margin:0 auto;width:100%;display:grid;gap:28px;align-content:start}
.pro-head{display:grid;gap:16px}
.pro-name{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pro-name h1{font-size:30px;line-height:36px}
.pro-sub{font-size:15px;line-height:22px;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:8px}
.contact a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9999px;border:1px solid var(--line);background:var(--s1);text-decoration:none;color:var(--text);font-size:14px;transition:all 700ms var(--ease)}
.contact a:hover{border-color:var(--accent)}
.contact i{color:var(--accent-t);font-size:16px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fact{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--s1)}
.fact dt{font-size:12px;line-height:16px;color:var(--muted);margin-bottom:4px}
.fact dd{font-size:15px;line-height:22px;font-weight:500}

.sec-h{font-size:13px;line-height:18px;font-weight:600;color:var(--accent-t);letter-spacing:.04em;margin-bottom:14px}
.qa{display:grid;gap:16px}
.qa .q{font-size:13px;line-height:18px;color:var(--muted);margin-bottom:6px}
.qa .a{font-size:16px;line-height:24px;padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.qa .a.work{border-color:var(--accent)}
.qa .a a{overflow-wrap:anywhere}

.review{display:grid;gap:14px;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--s1)}
.review label{font-size:13px;line-height:18px;font-weight:500;display:block;margin-bottom:6px}
.review input,.review textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.review textarea{min-height:90px;resize:vertical}
.review input:focus-visible,.review textarea:focus-visible{outline:none;border-color:var(--accent)}
.saved{font-size:13px;min-height:18px;color:var(--ok)}

.pro-foot{position:sticky;bottom:0;box-shadow:0 -12px 24px -12px rgba(0,0,0,.8);z-index:20;background:var(--s1);border-top:1px solid var(--line);padding:14px 16px}
.foot-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot-in .grow{flex:1;min-width:8px}
.move{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:860px;margin:10px auto 0}
.move span{font-size:12px;color:var(--muted);margin-right:2px}
.move button{padding:5px 11px;border-radius:9999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;line-height:18px;cursor:pointer;transition:all 700ms var(--ease)}
.move button:hover{color:var(--text);border-color:var(--muted)}
.move button.on{background:var(--s3);color:var(--text);border-color:var(--accent)}
@media(max-width:600px){
  .foot-in .btn{flex:1}
  .pro-name h1{font-size:24px;line-height:32px}
}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <h1>Applications</h1>
    <p class="muted" style="font-size:14px;line-height:20px">Purple Magic careers. Sign in to review candidates.</p>
    <div><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn p" type="submit" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <header class="bar">
    <span class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#7C3AED"/><path d="M319 74l1 95 91-31 41 122-90 31 55 74-102 77-55-74-55 78-105-74 55-78-91-28 38-122 91 28-1-95Z" fill="#fff"/></svg>Applications</span>
    <select id="fRole"><option value="">All roles</option></select>
    <input class="search" id="fSearch" type="search" placeholder="Name, email, reference">
    <span class="grow"></span>
    <span class="count" id="count"></span>
    <button class="btn g sm" id="csv"><i class="ph ph-download-simple"></i>CSV</button>
    <button class="btn g sm" id="out"><i class="ph ph-sign-out"></i>Sign out</button>
  </header>
  <nav class="buckets" id="buckets"></nav>
  <div class="list" id="list"></div>
</div>

<div class="profile" id="profile" hidden>
  <div class="pro-top">
    <button class="btn g sm" id="back"><i class="ph ph-arrow-left"></i>All applications</button>
    <span class="grow"></span>
    <span class="count" id="pos"></span>
  </div>
  <div class="pro-body" id="proBody"></div>
  <div class="pro-foot">
    <div class="foot-in" id="proFoot"></div>
    <div class="move" id="proMove"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://kvifzyskdmqtmteipvye.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2aWZ6eXNrZG1xdG10ZWlwdnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzUzMzYsImV4cCI6MjEwNjE1MTMzNn0.z5sV6xilywfkR6OPA1jVFd4o4W0br0YH23XItbCuKa8';
const db = createClient(SUPA_URL, ANON);
const $ = (id) => document.getElementById(id);

/* The pipeline. `next` is what the Proceed button does. */
const STAGES = [
  { id: 'new',           label: 'New in',              next: 'seen' },
  { id: 'seen',          label: 'Saw the profile',     next: 'awaiting' },
  { id: 'awaiting',      label: 'Awaiting input',      next: 'task' },
  { id: 'task',          label: 'Given task',          next: 'interview' },
  { id: 'interview',     label: 'Called for interview', next: 'hired' },
  { id: 'hired',         label: 'Hired',               next: null },
  { id: 'rejected',      label: 'Rejected',            next: null, end: true },
  { id: 'call_rejected', label: 'Called, rejected',    next: null, end: true }
];
const stage = (id) => STAGES.find(s => s.id === id) || STAGES[0];

let rows = [], labels = {}, bucket = 'new', selId = null;

fetch('careers/question-labels.json').then(r => r.ok ? r.json() : {}).then(d => { labels = d; }).catch(() => {});

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const band = (n) => n >= 70 ? 'hi' : n >= 40 ? 'mid' : 'lo';

/* ---------------------------------------------------------------- auth */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = error.message; return; }
  start();
});
$('out').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

async function start() {
  $('login').hidden = true;
  $('shell').hidden = false;
  await load();
}

async function load() {
  const { data, error } = await db.from('applications').select('*').order('auto_score', { ascending: false });
  if (error) {
    $('list').innerHTML = `<p class="empty">Could not load applications.<br><span class="mono">${esc(error.message)}</span><br><br>If that says permission denied, your account is not on the admin list. Run <span class="mono">select public.add_admin('your@email');</span> in Supabase.</p>`;
    return;
  }
  rows = data || [];
  const roles = [...new Set(rows.map(r => r.role_title))].sort();
  $('fRole').innerHTML = '<option value="">All roles</option>' + roles.map(r => `<option>${esc(r)}</option>`).join('');
  render();
}

/* -------------------------------------------------------------- listing */
function matchesFilters(r) {
  const role = $('fRole').value;
  const q = $('fSearch').value.trim().toLowerCase();
  return (!role || r.role_title === role) &&
         (!q || [r.name, r.email, r.reference, r.phone].join(' ').toLowerCase().includes(q));
}
const inBucket = () => rows.filter(r => matchesFilters(r) && r.status === bucket);

function render() {
  const base = rows.filter(matchesFilters);
  $('buckets').innerHTML = STAGES.map(s => {
    const n = base.filter(r => r.status === s.id).length;
    return `<button class="bucket${s.id === bucket ? ' on' : ''}" data-b="${s.id}">${esc(s.label)}<b>${n}</b></button>`;
  }).join('');
  $('buckets').querySelectorAll('.bucket').forEach(b =>
    b.addEventListener('click', () => { bucket = b.dataset.b; render(); }));

  const list = inBucket();
  $('count').textContent = `${base.length} in total`;
  $('list').innerHTML = list.length ? list.map(r => `
    <button class="row" data-id="${r.id}">
      <span class="score ${band(r.auto_score)}">${r.auto_score}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${esc(r.role_title)} &middot; ${esc(r.email)}</span></span>
      <span class="pills">
        ${r.knockout ? '<span class="pill ko">knocked out</span>' : ''}
        ${(r.flags || []).map(f => `<span class="pill flag">${esc(f)}</span>`).join('')}
        ${r.review_score != null ? `<span class="pill">written ${r.review_score}</span>` : ''}
        <i class="ph ph-caret-right muted"></i>
      </span>
    </button>`).join('') : `<p class="empty">Nothing in ${esc(stage(bucket).label).toLowerCase()}.</p>`;

  $('list').querySelectorAll('.row').forEach(b =>
    b.addEventListener('click', () => openProfile(b.dataset.id)));
}

/* -------------------------------------------------------------- profile */
function openProfile(id) {
  selId = id;
  $('shell').hidden = true;
  $('profile').hidden = false;
  window.scrollTo(0, 0);
  drawProfile();
}
$('back').addEventListener('click', closeProfile);
function closeProfile() {
  selId = null;
  $('profile').hidden = true;
  $('shell').hidden = false;
  render();
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('profile').hidden) closeProfile(); });

function drawProfile() {
  const r = rows.find(x => x.id === selId);
  if (!r) return closeProfile();
  const L = labels[r.role] || { questions: {} };
  const st = stage(r.status);

  const siblings = inBucket();
  const idx = siblings.findIndex(x => x.id === r.id);
  $('pos').textContent = idx >= 0 ? `${idx + 1} of ${siblings.length} in ${st.label.toLowerCase()}` : st.label;

  const entries = Object.entries(r.answers || {});
  const qa = entries.map(([k, v]) => {
    const meta = L.questions[k] || {};
    const text = Array.isArray(v) ? v.map(x => (meta.options || {})[x] || x).join(', ')
                                  : (meta.options || {})[v] || v;
    const s = String(text).trim();
    const isLink = /^(https?:\/\/|www\.)/i.test(s);
    const body = isLink
      ? `<a href="${esc(s.replace(/^www\./i, 'https://www.'))}" target="_blank" rel="noopener">${esc(s)}</a>`
      : esc(text);
    return `<div><p class="q">${esc(meta.label || k)}</p><p class="a${k === 'work' ? ' work' : ''}">${body}</p></div>`;
  }).join('');

  const phone = String(r.phone).replace(/^\+?91/, '');
  $('proBody').innerHTML = `
    <div class="pro-head">
      <div class="pro-name">
        <span class="score ${band(r.auto_score)}" style="width:64px;height:64px;font-size:20px">${r.auto_score}</span>
        <div>
          <h1>${esc(r.name)}</h1>
          <p class="pro-sub">${esc(r.role_title)} &middot; ${esc(r.brand)}</p>
        </div>
        <span class="grow"></span>
        <span class="pill st">${esc(st.label)}</span>
        ${r.knockout ? '<span class="pill ko">knocked out</span>' : ''}
        ${(r.flags || []).map(f => `<span class="pill flag">${esc(f)}</span>`).join('')}
      </div>
      <div class="contact">
        <a href="https://wa.me/91${esc(phone)}" target="_blank" rel="noopener"><i class="ph ph-whatsapp-logo"></i>${esc(r.phone)}</a>
        <a href="tel:+91${esc(phone)}"><i class="ph ph-phone"></i>Call</a>
        <a href="mailto:${esc(r.email)}"><i class="ph ph-envelope-simple"></i>${esc(r.email)}</a>
      </div>
      <dl class="facts">
        <div class="fact"><dt>Automatic score</dt><dd>${r.auto_score} / 100</dd></div>
        <div class="fact"><dt>Written answers</dt><dd>${r.review_score != null ? r.review_score + ' / 100' : 'Not scored'}</dd></div>
        <div class="fact"><dt>Reference</dt><dd class="mono">${esc(r.reference)}</dd></div>
        <div class="fact"><dt>Applied</dt><dd>${new Date(r.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</dd></div>
      </dl>
    </div>

    <div>
      <p class="sec-h">THEIR ANSWERS</p>
      <div class="qa">${qa || '<p class="muted">No answers recorded.</p>'}</div>
    </div>

    <div>
      <p class="sec-h">YOUR REVIEW</p>
      <div class="review">
        <div><label for="dScore">Written answers, out of 100</label><input id="dScore" type="number" min="0" max="100" value="${r.review_score ?? ''}" placeholder="Not scored yet"></div>
        <div><label for="dNotes">Private notes</label><textarea id="dNotes" placeholder="Only your team sees this.">${esc(r.notes || '')}</textarea></div>
        <button class="btn g" id="dSave">Save review</button>
        <p class="saved" id="dSaved"></p>
      </div>
    </div>`;

  $('proFoot').innerHTML = `
    ${st.end ? '' : '<button class="btn danger" id="aReject"><i class="ph ph-x"></i>Reject</button>'}
    ${['task','interview','awaiting'].includes(st.id) ? '<button class="btn danger" id="aCallReject"><i class="ph ph-phone-x"></i>Called, rejected</button>' : ''}
    <span class="grow"></span>
    ${st.next ? `<button class="btn p" id="aNext">Proceed to ${esc(stage(st.next).label.toLowerCase())}<i class="ph ph-arrow-right"></i></button>`
              : '<span class="muted" style="font-size:13px">No further stage</span>'}`;

  $('proMove').innerHTML = '<span>Move to</span>' + STAGES
    .filter(s => s.id !== r.status)
    .map(s => `<button data-s="${s.id}">${esc(s.label)}</button>`).join('');

  $('dSave').addEventListener('click', () => saveReview(r));
  const nx = $('aNext'); if (nx) nx.addEventListener('click', () => move(r, st.next, true));
  const rj = $('aReject'); if (rj) rj.addEventListener('click', () => move(r, 'rejected', true));
  const cr = $('aCallReject'); if (cr) cr.addEventListener('click', () => move(r, 'call_rejected', true));
  $('proMove').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => move(r, b.dataset.s, false)));
}

async function saveReview(r) {
  const btn = $('dSave'); btn.disabled = true;
  const raw = $('dScore').value.trim();
  const patch = {
    notes: $('dNotes').value.trim() || null,
    review_score: raw === '' ? null : Math.max(0, Math.min(100, Number(raw)))
  };
  const { error } = await db.from('applications').update(patch).eq('id', r.id);
  btn.disabled = false;
  const msg = $('dSaved');
  if (error) { msg.style.color = 'var(--bad)'; msg.textContent = error.message; return; }
  Object.assign(r, patch);
  msg.style.color = 'var(--ok)'; msg.textContent = 'Saved.';
  setTimeout(() => { msg.textContent = ''; }, 2500);
}

/* Moving on jumps to the next person in the bucket, so you can work a pile
   without going back to the list each time. */
async function move(r, to, advance) {
  const siblings = inBucket();
  const idx = siblings.findIndex(x => x.id === r.id);
  const { error } = await db.from('applications').update({ status: to }).eq('id', r.id);
  if (error) {
    const msg = $('dSaved');
    if (msg) { msg.style.color = 'var(--bad)'; msg.textContent = error.message; }
    return;
  }
  r.status = to;
  const rest = inBucket();
  if (advance && rest.length) {
    const nextOne = rest[Math.min(idx, rest.length - 1)];
    if (nextOne) { selId = nextOne.id; window.scrollTo(0, 0); drawProfile(); return; }
  }
  closeProfile();
}

/* ------------------------------------------------------------------ csv */
$('csv').addEventListener('click', () => {
  const list = rows.filter(matchesFilters);
  if (!list.length) return;
  const cols = ['reference','created_at','role_title','brand','name','email','phone','auto_score','review_score','knockout','flags','status','notes'];
  const cell = (v) => {
    if (v == null) return '';
    const s = Array.isArray(v) ? v.join(' ') : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const body = list.map(r => {
    const ans = Object.entries(r.answers || {}).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(' ') : v}`).join(' | ');
    return cols.map(c => cell(c === 'status' ? stage(r.status).label : r[c])).concat(cell(ans)).join(',');
  });
  const csv = cols.concat('answers').join(',') + '\n' + body.join('\n');
  // Byte order mark so Excel opens Indian names correctly.
  const href = window.URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = href;
  a.download = `applications-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => window.URL.revokeObjectURL(href), 1000);
});

['fRole','fSearch'].forEach(id => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});

db.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Applications | Purple Magic</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --bg:#000; --s1:#181818; --s2:#1F1F1F; --s3:#272727; --line:#313131;
  --text:#FFF; --muted:#9B9B9B; --accent:#7C3AED; --accent-t:#B794F6;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --ease:cubic-bezier(0.32,0.72,0,1);
  --sans:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 16px/24px var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-t);outline-offset:2px;border-radius:4px}
a{color:var(--accent-t)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9999px;border:1px solid transparent;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 700ms var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.p{background:var(--accent);color:#fff}
.p:hover{background:var(--accent-t);color:#000}
.g{background:transparent;border-color:var(--line)}
.g:hover{background:var(--s3)}
.danger{background:transparent;border-color:rgba(248,113,113,.4);color:var(--bad)}
.danger:hover{background:rgba(248,113,113,.12)}
.sm{padding:6px 12px;font-size:13px;line-height:18px}

/* ---------------------------------------------------------------- login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px;display:grid;gap:16px;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:32px}
.login h1{font-size:24px;line-height:32px}
.login label{display:block;font-size:14px;line-height:20px;font-weight:500;margin-bottom:8px}
.login input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.login input:focus-visible{border-color:var(--accent);outline:none}
.err{font-size:14px;line-height:20px;color:var(--bad);min-height:20px}

/* ---------------------------------------------------------------- shell */
header.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.brand svg{width:24px;height:24px}
.grow{flex:1}
select,.search{padding:8px 12px;border-radius:9999px;border:1px solid var(--line);background:var(--bg);font-size:14px;line-height:20px}
.search{min-width:170px}
.count{font-size:13px;color:var(--muted)}

.buckets{position:sticky;top:57px;z-index:19;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.bucket{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9999px;border:1px solid var(--line);background:var(--s1);font-size:14px;line-height:20px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 700ms var(--ease)}
.bucket:hover{color:var(--text);border-color:var(--muted)}
.bucket.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bucket b{font-family:var(--mono);font-weight:500;font-size:13px;padding:1px 7px;border-radius:9999px;background:rgba(255,255,255,.12)}
.bucket.on b{background:rgba(0,0,0,.25)}

.list{padding:16px;display:grid;gap:8px;align-content:start;max-width:1100px;margin:0 auto}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;transition:all 700ms var(--ease)}
.row:hover{border-color:var(--accent);transform:translateY(-1px)}
.score{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:500 17px/1 var(--mono);background:var(--s3)}
.score.hi{background:rgba(74,222,128,.15);color:var(--ok)}
.score.mid{background:rgba(251,191,36,.15);color:var(--warn)}
.score.lo{background:rgba(248,113,113,.12);color:var(--bad)}
.who{display:grid;gap:3px;min-width:0}
.who b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{font-size:11px;line-height:16px;padding:3px 9px;border-radius:9999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ko{border-color:var(--bad);color:var(--bad)}
.pill.flag{border-color:var(--warn);color:var(--warn)}
.pill.st{border-color:var(--accent);color:var(--accent-t)}
.empty{padding:64px 24px;text-align:center;color:var(--muted)}

/* -------------------------------------------------------------- profile */
.profile{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.pro-scroll{overflow:visible}
.pro-top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--line)}
.pro-body{padding:24px 16px 40px;max-width:860px;margin:0 auto;width:100%;display:grid;gap:28px;align-content:start}
.pro-head{display:grid;gap:16px}
.pro-name{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.pro-name h1{font-size:30px;line-height:36px}
.pro-sub{font-size:15px;line-height:22px;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:8px}
.contact a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9999px;border:1px solid var(--line);background:var(--s1);text-decoration:none;color:var(--text);font-size:14px;transition:all 700ms var(--ease)}
.contact a:hover{border-color:var(--accent)}
.contact i{color:var(--accent-t);font-size:16px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fact{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--s1)}
.fact dt{font-size:12px;line-height:16px;color:var(--muted);margin-bottom:4px}
.fact dd{font-size:15px;line-height:22px;font-weight:500}

.sec-h{font-size:13px;line-height:18px;font-weight:600;color:var(--accent-t);letter-spacing:.04em;margin-bottom:14px}
.qa{display:grid;gap:16px}
.qa .q{font-size:13px;line-height:18px;color:var(--muted);margin-bottom:6px}
.qa .a{font-size:16px;line-height:24px;padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.qa .a.work{border-color:var(--accent)}
.qa .a a{overflow-wrap:anywhere}
.wls{display:flex;flex-wrap:wrap;gap:8px}
.wl{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 12px;border-radius:9999px;border:1px solid var(--line);background:var(--bg);color:var(--accent-t);text-decoration:none;font-size:14px;line-height:20px;overflow-wrap:anywhere;transition:all 700ms var(--ease)}
.wl:hover{border-color:var(--accent);background:var(--s3)}
.wl i{font-size:15px;flex:none;opacity:.8}
.wl .hint{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:9999px;padding:0 6px}
.wnote{display:block;margin-top:10px;color:var(--muted);font-size:14px;line-height:20px}
.star{background:none;border:0;cursor:pointer;color:var(--line);font-size:22px;line-height:1;padding:4px;transition:color 700ms var(--ease),transform 700ms var(--ease)}
.star:hover{color:var(--warn);transform:scale(1.1)}
.star.on{color:var(--warn)}
.star.big{font-size:28px}
.bucket.starred.on{background:var(--warn);border-color:var(--warn);color:#000}
.moveErr{width:100%;margin:0 0 10px;padding:10px 14px;border-radius:12px;border:1px solid var(--bad);background:rgba(248,113,113,.12);color:var(--bad);font-size:14px;line-height:20px}
.moveErr[hidden]{display:none}
.moveErr b{display:block;margin-bottom:2px}

.roles-wrap{padding:24px 16px 48px}
.roles{max-width:1000px;margin:0 auto;display:grid;gap:12px}
@media(min-width:760px){.roles{grid-template-columns:1fr 1fr}}
.role{display:grid;gap:14px;padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--s1);cursor:pointer;text-align:left;transition:all 700ms var(--ease)}
.role:hover{border-color:var(--accent);transform:translateY(-2px)}
.role h2{font-size:20px;line-height:28px}
.role .sub{font-size:13px;line-height:18px;color:var(--muted)}
.role .nums{display:flex;flex-wrap:wrap;gap:8px}
.num{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:9999px;border:1px solid var(--line);font-size:13px;line-height:18px;color:var(--muted)}
.num b{font-family:var(--mono);font-size:15px;color:var(--text)}
.num.hot{border-color:var(--accent);color:var(--accent-t)}
.num.hot b{color:var(--accent-t)}
.role .last{font-size:12px;line-height:16px;color:var(--muted)}
.when{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.row .when{margin-right:2px}

.verdicts{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.verdicts .btn{flex:1;min-width:150px}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-in{width:min(460px,100%);max-height:92dvh;display:grid;grid-template-rows:auto 1fr auto;background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.modal-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-top .u{flex:1;min-width:0;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-body{background:#000;display:grid;place-items:center;min-height:320px;overflow:auto}
.modal-body iframe{width:100%;height:min(70dvh,640px);border:0;display:block}
.modal-msg{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:20px;display:grid;gap:14px;justify-items:center}
.modal-foot{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.modal-foot .grow{flex:1}
.redir{font-size:12px;line-height:16px;color:var(--warn)}

.review{display:grid;gap:14px;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--s1)}
.review label{font-size:13px;line-height:18px;font-weight:500;display:block;margin-bottom:6px}
.review input,.review textarea{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.review textarea{min-height:90px;resize:vertical}
.review input:focus-visible,.review textarea:focus-visible{outline:none;border-color:var(--accent)}
.saved{font-size:13px;min-height:18px;color:var(--ok)}

.pro-foot{position:sticky;bottom:0;box-shadow:0 -12px 24px -12px rgba(0,0,0,.8);z-index:20;background:var(--s1);border-top:1px solid var(--line);padding:14px 16px}
.foot-in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot-in .grow{flex:1;min-width:8px}
.move{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:860px;margin:10px auto 0}
.move span{font-size:12px;color:var(--muted);margin-right:2px}
.move button{padding:5px 11px;border-radius:9999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;line-height:18px;cursor:pointer;transition:all 700ms var(--ease)}
.move button:hover{color:var(--text);border-color:var(--muted)}
.move button.on{background:var(--s3);color:var(--text);border-color:var(--accent)}
@media(max-width:600px){
  .foot-in .btn{flex:1}
  .pro-name h1{font-size:24px;line-height:32px}
}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <h1>Applications</h1>
    <p class="muted" style="font-size:14px;line-height:20px">Purple Magic careers. Sign in to review candidates.</p>
    <div><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn p" type="submit" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div class="home" id="home" hidden>
  <header class="bar">
    <span class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#7C3AED"/><path d="M319 74l1 95 91-31 41 122-90 31 55 74-102 77-55-74-55 78-105-74 55-78-91-28 38-122 91 28-1-95Z" fill="#fff"/></svg>Applications</span>
    <span class="grow"></span>
    <span class="count" id="homeCount"></span>
    <button class="btn g sm" id="outHome"><i class="ph ph-sign-out"></i>Sign out</button>
  </header>
  <div class="roles-wrap"><div class="roles" id="roles"></div></div>
</div>

<div class="shell" id="shell" hidden>
  <header class="bar">
    <span class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#7C3AED"/><path d="M319 74l1 95 91-31 41 122-90 31 55 74-102 77-55-74-55 78-105-74 55-78-91-28 38-122 91 28-1-95Z" fill="#fff"/></svg>Applications</span>
    <button class="btn g sm" id="toHome"><i class="ph ph-arrow-left"></i>All jobs</button>
    <span class="count" id="roleName"></span>
    <input class="search" id="fSearch" type="search" placeholder="Name, email, handle">
    <span class="grow"></span>
    <span class="count" id="count"></span>
    <button class="btn g sm" id="csv"><i class="ph ph-download-simple"></i>CSV</button>
    <button class="btn g sm" id="out"><i class="ph ph-sign-out"></i>Sign out</button>
  </header>
  <nav class="buckets" id="buckets"></nav>
  <div class="list" id="list"></div>
</div>

<div class="profile" id="profile" hidden>
  <div class="pro-top">
    <button class="btn g sm" id="back"><i class="ph ph-arrow-left"></i>All applications</button>
    <span class="grow"></span>
    <span class="count" id="pos"></span>
  </div>
  <div class="pro-body" id="proBody"></div>
  <div class="pro-foot">
    <div class="foot-in" id="proFoot"></div>
    <div class="move" id="proMove"></div>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Preview">
  <div class="modal-in">
    <div class="modal-top">
      <i class="ph ph-link" aria-hidden="true"></i>
      <span class="u" id="mUrl"></span>
      <button class="btn g sm" id="mClose" aria-label="Close preview"><i class="ph ph-x"></i></button>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot">
      <span class="redir" id="mNote"></span>
      <span class="grow"></span>
      <button class="btn g sm" id="mCopy"><i class="ph ph-copy"></i>Copy link</button>
      <a class="btn p sm" id="mOpen" target="_blank" rel="noopener"><i class="ph ph-arrow-square-out"></i>Open</a>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPA_URL = 'https://kvifzyskdmqtmteipvye.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt2aWZ6eXNrZG1xdG10ZWlwdnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NzUzMzYsImV4cCI6MjEwNjE1MTMzNn0.z5sV6xilywfkR6OPA1jVFd4o4W0br0YH23XItbCuKa8';
const db = createClient(SUPA_URL, ANON);
const $ = (id) => document.getElementById(id);

/* The pipeline. `next` is what the Proceed button does. */
const STAGES = [
  { id: 'new',           label: 'New in' },
  { id: 'relevant',      label: 'Relevant' },
  { id: 'considered',    label: 'Can be considered' },
  { id: 'seen',          label: 'Saw the profile' },
  { id: 'awaiting',      label: 'Awaiting input' },
  { id: 'task',          label: 'Given task' },
  { id: 'interview',     label: 'Called for interview' },
  { id: 'hired',         label: 'Hired' },
  { id: 'rejected',      label: 'Rejected' },
  { id: 'call_rejected', label: 'Called, rejected' }
];
/* The three calls you make on almost every profile. Everything else is a
   move-to chip, so the common decision stays one tap. */
const VERDICTS = [
  { id: 'rejected',   label: 'Rejected',          cls: 'danger', icon: 'ph-x' },
  { id: 'considered', label: 'Can be considered', cls: 'g',      icon: 'ph-bookmark-simple' },
  { id: 'relevant',   label: 'Relevant',          cls: 'p',      icon: 'ph-check' }
];

function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  const m = s / 60; if (m < 60) return Math.floor(m) + 'm ago';
  const h = m / 60; if (h < 24) return Math.floor(h) + 'h ago';
  const d = h / 24; if (d < 7) return Math.floor(d) + 'd ago';
  return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}
const stage = (id) => STAGES.find(s => s.id === id) || STAGES[0];

let rows = [], labels = {}, bucket = 'new', selId = null, roleFilter = null;

fetch('careers/question-labels.json').then(r => r.ok ? r.json() : {}).then(d => { labels = d; }).catch(() => {});

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const band = (n) => n >= 70 ? 'hi' : n >= 40 ? 'mid' : 'lo';

/* ---------------------------------------------------------------- auth */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  $('loginBtn').disabled = true;
  const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = error.message; return; }
  start();
});
$('out').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

async function start() {
  $('login').hidden = true;
  await load();
  showHome();
}

/* Home: one card per role, so you pick a job and then work its pile. */
function showHome() {
  roleFilter = null; selId = null;
  $('shell').hidden = true; $('profile').hidden = true;
  $('home').hidden = false;
  window.scrollTo(0, 0);

  const byRole = new Map();
  rows.forEach(r => {
    if (!byRole.has(r.role)) byRole.set(r.role, { title: r.role_title, brand: r.brand, list: [] });
    byRole.get(r.role).list.push(r);
  });

  $('homeCount').textContent = `${rows.length} application${rows.length === 1 ? '' : 's'} in total`;

  const cards = [...byRole.entries()]
    .sort((a, b) => b[1].list.filter(r => r.status === 'new').length - a[1].list.filter(r => r.status === 'new').length)
    .map(([slug, v]) => {
      const n = (st) => v.list.filter(r => r.status === st).length;
      const latest = v.list.reduce((m, r) => (!m || r.created_at > m ? r.created_at : m), null);
      return `<div class="role" data-role="${esc(slug)}" role="button" tabindex="0">
        <div>
          <h2>${esc(v.title)}</h2>
          <p class="sub">${esc(v.brand)}</p>
        </div>
        <div class="nums">
          <span class="num${n('new') ? ' hot' : ''}"><b>${n('new')}</b> new in</span>
          <span class="num"><b>${n('relevant')}</b> relevant</span>
          <span class="num"><b>${n('considered')}</b> considered</span>
          <span class="num"><b>${v.list.filter(r => r.starred).length}</b> starred</span>
          <span class="num"><b>${v.list.length}</b> total</span>
        </div>
        ${latest ? `<p class="last">Latest ${esc(ago(latest))}</p>` : ''}
      </div>`;
    }).join('');

  $('roles').innerHTML = cards || '<p class="empty">No applications yet. They will appear here as they come in.</p>';
  $('roles').querySelectorAll('.role').forEach(c => {
    const go = () => openRole(c.dataset.role);
    c.addEventListener('click', go);
    c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

function openRole(slug) {
  roleFilter = slug;
  bucket = 'new';
  $('home').hidden = true;
  $('shell').hidden = false;
  $('fSearch').value = '';
  window.scrollTo(0, 0);
  render();
}

async function load() {
  const { data, error } = await db.from('applications').select('*').order('starred', { ascending: false }).order('auto_score', { ascending: false });
  if (error) {
    $('list').innerHTML = `<p class="empty">Could not load applications.<br><span class="mono">${esc(error.message)}</span><br><br>If that says permission denied, your account is not on the admin list. Run <span class="mono">select public.add_admin('your@email');</span> in Supabase.</p>`;
    return;
  }
  rows = data || [];

}

/* -------------------------------------------------------------- listing */
function matchesFilters(r) {
  const q = $('fSearch').value.trim().toLowerCase();
  return (!roleFilter || r.role === roleFilter) &&
         (!q || [r.name, r.email, r.reference, r.phone, r.answers && r.answers.ig].join(' ').toLowerCase().includes(q));
}
const inBucket = () => bucket === '@starred'
  ? rows.filter(r => matchesFilters(r) && r.starred)
  : rows.filter(r => matchesFilters(r) && r.status === bucket);

function render() {
  const base = rows.filter(matchesFilters);
  const starCount = base.filter(r => r.starred).length;
  $('buckets').innerHTML = STAGES.map(s => {
    const n = base.filter(r => r.status === s.id).length;
    return `<button class="bucket${s.id === bucket ? ' on' : ''}" data-b="${s.id}">${esc(s.label)}<b>${n}</b></button>`;
  }).join('') +
  `<button class="bucket starred${bucket === '@starred' ? ' on' : ''}" data-b="@starred" title="Everyone you starred, whatever stage they are at">&#9733; Starred<b>${starCount}</b></button>`;
  $('buckets').querySelectorAll('.bucket').forEach(b =>
    b.addEventListener('click', () => { bucket = b.dataset.b; render(); }));

  const list = inBucket();
  const cur = rows.find(r => r.role === roleFilter);
  $('roleName').textContent = cur ? cur.role_title : '';
  $('count').textContent = `${base.length} in this job`;
  $('list').innerHTML = list.length ? list.map(r => `
    <div class="row" data-id="${r.id}" role="button" tabindex="0">
      <span class="score ${band(r.auto_score)}">${r.auto_score}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${esc(r.role_title)} &middot; ${esc(r.email)}</span></span>
      <span class="pills">
        ${r.knockout ? '<span class="pill ko">knocked out</span>' : ''}
        ${(r.flags || []).map(f => `<span class="pill flag">${esc(f)}</span>`).join('')}
        ${r.review_score != null ? `<span class="pill">written ${r.review_score}</span>` : ''}
        ${bucket === '@starred' ? `<span class="pill st">${esc(stage(r.status).label)}</span>` : ''}
        <span class="when">${esc(ago(r.created_at))}</span>
        <button class="star${r.starred ? ' on' : ''}" data-star="${r.id}" aria-label="${r.starred ? 'Remove star' : 'Star this candidate'}" aria-pressed="${!!r.starred}">&#9733;</button>
      </span>
    </div>`).join('') : `<p class="empty">Nothing ${bucket === '@starred' ? 'starred yet.' : 'in ' + esc(stage(bucket).label).toLowerCase() + '.'}</p>`;

  $('list').querySelectorAll('.row').forEach(b => {
    b.addEventListener('click', (e) => { if (!e.target.closest('[data-star]')) openProfile(b.dataset.id); });
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openProfile(b.dataset.id); } });
  });
  $('list').querySelectorAll('[data-star]').forEach(b =>
    b.addEventListener('click', (e) => { e.stopPropagation(); toggleStar(b.dataset.star); }));
}

/* -------------------------------------------------------------- profile */
function openProfile(id) {
  selId = id;
  $('shell').hidden = true;
  $('profile').hidden = false;
  window.scrollTo(0, 0);
  drawProfile();
}
$('back').addEventListener('click', closeProfile);
function closeProfile() {
  selId = null;
  $('profile').hidden = true;
  $('shell').hidden = false;
  render();
}
window.addEventListener('popstate', () => { if (!$('profile').hidden) closeProfile(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('modal').hidden) { closePeek(); return; }
  if (!$('profile').hidden) closeProfile();
});

/* Work links. Candidates paste full URLs, bare domains, or bare handles, often
   several at once. These rules match the ones the application form validates
   with, so anything it accepted shows up here as something you can click. */
const LINK_TOKEN = /^(https?:\/\/\S{4,}|(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/\S*)?|@[A-Za-z0-9._]{2,})$/i;
function hrefFor(t) {
  if (/^https?:\/\//i.test(t)) return t;
  if (t.startsWith('@')) return 'https://www.instagram.com/' + t.slice(1);
  return 'https://' + t;
}
function workLinksHtml(raw) {
  const text = String(raw || '');
  const parts = text.split(/[\s,]+/).map(t => t.replace(/[.,;)]+$/, '').trim()).filter(Boolean);
  const links = parts.filter(t => LINK_TOKEN.test(t));
  if (!links.length) return esc(text);
  const words = parts.filter(t => !LINK_TOKEN.test(t)).join(' ');
  const chips = links.map(t => {
    const h = hrefFor(t);
    const kind = t.startsWith('@') ? ' <span class="hint">handle</span>' : '';
    return `<button class="wl" data-peek="${esc(h)}"><i class="ph ph-play-circle"></i>${esc(t)}${kind}</button>`;
  }).join('');
  return `<span class="wls">${chips}</span>` + (words ? `<span class="wnote">${esc(words)}</span>` : '');
}

/* Open a link inside the dashboard rather than a new tab. Instagram and
   YouTube get a real embed, so you can watch without leaving, and the bar
   always shows the address the link actually resolves to, which is how you
   catch one that has been swapped for something else. */
function embedFor(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '');
    if (/^(youtube\.com|m\.youtube\.com)$/.test(host)) {
      const id = u.searchParams.get('v') || (u.pathname.match(/\/shorts\/([\w-]+)/) || [])[1];
      if (id) return { src: 'https://www.youtube.com/embed/' + id, note: '' };
    }
    if (host === 'youtu.be') {
      const id = u.pathname.slice(1);
      if (id) return { src: 'https://www.youtube.com/embed/' + id, note: '' };
    }
    if (host === 'instagram.com') {
      const m = u.pathname.match(/\/(p|reel|tv)\/([\w-]+)/);
      if (m) return { src: `https://www.instagram.com/${m[1]}/${m[2]}/embed`, note: '' };
      return { src: null, note: 'Instagram does not allow profiles to be shown inside another page. Open it to check the account.' };
    }
    if (host === 'drive.google.com') {
      const m = u.pathname.match(/\/file\/d\/([\w-]+)/);
      if (m) return { src: `https://drive.google.com/file/d/${m[1]}/preview`, note: '' };
      return { src: null, note: 'A Drive folder cannot be shown here. Open it to look inside.' };
    }
    if (host === 'vimeo.com') {
      const id = u.pathname.split('/').filter(Boolean)[0];
      if (/^\d+$/.test(id)) return { src: 'https://player.vimeo.com/video/' + id, note: '' };
    }
  } catch (e) { /* not a URL we can parse */ }
  return { src: null, note: 'This site cannot be shown inside the dashboard. Open it in a tab instead.' };
}

function peek(url) {
  const { src, note } = embedFor(url);
  $('mUrl').textContent = url;
  $('mOpen').href = url;
  $('mNote').textContent = note;
  $('mBody').innerHTML = src
    ? `<iframe src="${esc(src)}" allow="accelerometer; clipboard-write; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="origin"></iframe>`
    : `<div class="modal-msg"><i class="ph ph-arrow-square-out" style="font-size:32px"></i><p>${esc(note || 'No preview available.')}</p></div>`;
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
  $('mClose').focus();
}
function closePeek() {
  $('modal').hidden = true;
  $('mBody').innerHTML = '';
  document.body.style.overflow = '';
}
$('mClose').addEventListener('click', closePeek);
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closePeek(); });
$('mCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('mUrl').textContent); $('mCopy').innerHTML = '<i class="ph ph-check"></i>Copied';
        setTimeout(() => { $('mCopy').innerHTML = '<i class="ph ph-copy"></i>Copy link'; }, 1800); } catch (e) {}
});

function drawProfile() {
  const r = rows.find(x => x.id === selId);
  if (!r) return closeProfile();
  const L = labels[r.role] || { questions: {} };
  const st = stage(r.status);

  const siblings = inBucket();
  const idx = siblings.findIndex(x => x.id === r.id);
  $('pos').textContent = idx >= 0 ? `${idx + 1} of ${siblings.length} in ${st.label.toLowerCase()}` : st.label;

  const entries = Object.entries(r.answers || {});
  const qa = entries.map(([k, v]) => {
    const meta = L.questions[k] || {};
    const text = Array.isArray(v) ? v.map(x => (meta.options || {})[x] || x).join(', ')
                                  : (meta.options || {})[v] || v;
    const body = k === 'work' ? workLinksHtml(text) : esc(text);
    return `<div><p class="q">${esc(meta.label || k)}</p><p class="a${k === 'work' ? ' work' : ''}">${body}</p></div>`;
  }).join('');

  const phone = String(r.phone).replace(/^\+?91/, '');
  $('proBody').innerHTML = `
    <div class="pro-head">
      <div class="pro-name">
        <span class="score ${band(r.auto_score)}" style="width:64px;height:64px;font-size:20px">${r.auto_score}</span>
        <div>
          <h1>${esc(r.name)}</h1>
          <p class="pro-sub">${esc(r.role_title)} &middot; ${esc(r.brand)}</p>
        </div>
        <span class="grow"></span>
        <button class="star big${r.starred ? ' on' : ''}" id="proStar" aria-label="${r.starred ? 'Remove star' : 'Star this candidate'}" aria-pressed="${!!r.starred}">&#9733;</button>
        <span class="pill st">${esc(st.label)}</span>
        ${r.knockout ? '<span class="pill ko">knocked out</span>' : ''}
        ${(r.flags || []).map(f => `<span class="pill flag">${esc(f)}</span>`).join('')}
      </div>
      <div class="contact">
        ${r.answers && r.answers.ig ? `<a href="https://www.instagram.com/${esc(r.answers.ig)}" target="_blank" rel="noopener"><i class="ph ph-instagram-logo"></i>@${esc(r.answers.ig)}</a>` : ''}
        <a href="https://wa.me/91${esc(phone)}" target="_blank" rel="noopener"><i class="ph ph-whatsapp-logo"></i>${esc(r.phone)}</a>
        <a href="tel:+91${esc(phone)}"><i class="ph ph-phone"></i>Call</a>
        <a href="mailto:${esc(r.email)}"><i class="ph ph-envelope-simple"></i>${esc(r.email)}</a>
      </div>
      <dl class="facts">
        <div class="fact"><dt>Automatic score</dt><dd>${r.auto_score} / 100</dd></div>
        <div class="fact"><dt>Written answers</dt><dd>${r.review_score != null ? r.review_score + ' / 100' : 'Not scored'}</dd></div>
        <div class="fact"><dt>Reference</dt><dd class="mono">${esc(r.reference)}</dd></div>
        <div class="fact"><dt>Applied</dt><dd>${esc(ago(r.created_at))}<br><span class="muted" style="font-size:12px">${new Date(r.created_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</span></dd></div>
      </dl>
    </div>

    <div>
      <p class="sec-h">THEIR ANSWERS</p>
      <div class="qa">${qa || '<p class="muted">No answers recorded.</p>'}</div>
    </div>

    <div>
      <p class="sec-h">YOUR REVIEW</p>
      <div class="review">
        <div><label for="dScore">Written answers, out of 100</label><input id="dScore" type="number" min="0" max="100" value="${r.review_score ?? ''}" placeholder="Not scored yet"></div>
        <div><label for="dNotes">Private notes</label><textarea id="dNotes" placeholder="Only your team sees this.">${esc(r.notes || '')}</textarea></div>
        <button class="btn g" id="dSave">Save review</button>
        <p class="saved" id="dSaved"></p>
      </div>
    </div>`;

  $('proFoot').innerHTML = `
    <p class="moveErr" id="moveErr" hidden></p>
    <div class="verdicts">
      ${VERDICTS.map(v => `<button class="btn ${v.cls}${r.status === v.id ? ' on' : ''}" data-verdict="${v.id}">
        <i class="ph ${v.icon}"></i>${esc(v.label)}</button>`).join('')}
    </div>`;

  $('proMove').innerHTML = '<span>Move to</span>' + STAGES
    .filter(s => s.id !== r.status)
    .map(s => `<button data-s="${s.id}">${esc(s.label)}</button>`).join('');

  $('dSave').addEventListener('click', () => saveReview(r));
  $('proStar').addEventListener('click', () => toggleStar(r.id));
  $('proBody').querySelectorAll('[data-peek]').forEach(b =>
    b.addEventListener('click', () => peek(b.dataset.peek)));
  $('proFoot').querySelectorAll('[data-verdict]').forEach(b =>
    b.addEventListener('click', () => move(r, b.dataset.verdict, true)));
  $('proMove').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => move(r, b.dataset.s, false)));
}

async function toggleStar(id) {
  const r = rows.find(x => x.id === id);
  if (!r) return;
  const want = !r.starred;
  r.starred = want;                       // show it at once
  if (selId === id) drawProfile(); else render();
  const { error } = await db.from('applications').update({ starred: want }).eq('id', id);
  if (error) {
    r.starred = !want;                    // put it back
    if (selId === id) drawProfile(); else render();
    showMoveError('Could not save the star', error.message);
  }
}

/* A failed move used to write into the review card, which is usually scrolled
   out of sight, so it looked like nothing happened. Errors now appear with the
   buttons that caused them. */
function showMoveError(what, detail) {
  const el = $('moveErr');
  const stale = /check constraint|violates|invalid input value/i.test(detail || '');
  const msg = stale
    ? 'The database still has the old stage names. Run supabase/dashboard-update.sql in the Supabase SQL editor, then reload this page.'
    : detail;
  if (!el) { alert(what + ': ' + msg); return; }
  el.innerHTML = `<b>${esc(what)}</b>${esc(msg)}`;
  el.hidden = false;
}

async function saveReview(r) {
  const btn = $('dSave'); btn.disabled = true;
  const raw = $('dScore').value.trim();
  const patch = {
    notes: $('dNotes').value.trim() || null,
    review_score: raw === '' ? null : Math.max(0, Math.min(100, Number(raw)))
  };
  const { error } = await db.from('applications').update(patch).eq('id', r.id);
  btn.disabled = false;
  const msg = $('dSaved');
  if (error) { msg.style.color = 'var(--bad)'; msg.textContent = error.message; return; }
  Object.assign(r, patch);
  msg.style.color = 'var(--ok)'; msg.textContent = 'Saved.';
  setTimeout(() => { msg.textContent = ''; }, 2500);
}

/* Moving on jumps to the next person in the bucket, so you can work a pile
   without going back to the list each time. */
async function move(r, to, advance) {
  const siblings = inBucket();
  const idx = siblings.findIndex(x => x.id === r.id);
  const { error } = await db.from('applications').update({ status: to }).eq('id', r.id);
  if (error) {
    showMoveError('Could not move to ' + stage(to).label.toLowerCase(), error.message);
    return;
  }
  r.status = to;
  const rest = inBucket();
  if (advance && rest.length) {
    const nextOne = rest[Math.min(idx, rest.length - 1)];
    if (nextOne) { selId = nextOne.id; window.scrollTo(0, 0); drawProfile(); return; }
  }
  closeProfile();
}

/* ------------------------------------------------------------------ csv */
$('csv').addEventListener('click', () => {
  const list = rows.filter(matchesFilters);
  if (!list.length) return;
  const cols = ['reference','created_at','role_title','brand','name','email','phone','starred','auto_score','review_score','knockout','flags','status','notes'];
  const cell = (v) => {
    if (v == null) return '';
    const s = Array.isArray(v) ? v.join(' ') : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const body = list.map(r => {
    const ans = Object.entries(r.answers || {}).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(' ') : v}`).join(' | ');
    return cols.map(c => cell(c === 'status' ? stage(r.status).label : r[c])).concat(cell(ans)).join(',');
  });
  const csv = cols.concat('answers').join(',') + '\n' + body.join('\n');
  // Byte order mark so Excel opens Indian names correctly.
  const href = window.URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = href;
  a.download = `applications-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => window.URL.revokeObjectURL(href), 1000);
});

$('fSearch').addEventListener('input', render);
$('toHome').addEventListener('click', showHome);
$('outHome').addEventListener('click', async () => { await db.auth.signOut(); location.reload(); });

db.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script>
